openapi: 3.0.3
info:
  title: Pottery Shop Management System API
  version: 1.0.0
  description: >
    OpenAPI documentation for the Express API mounted at /api/v1.
    Authentication supports the httpOnly accessToken cookie and Bearer tokens.
servers:
  - url: http://localhost:3000/api/v1
    description: Local backend
  - url: https://ceramic-shop-u8ak.onrender.com/api/v1
    description: Production backend
tags:
  - name: Auth
  - name: Profile
  - name: Catalog
  - name: Cart
  - name: Orders
  - name: Payments
  - name: Promotions
  - name: Reviews
  - name: News
  - name: Warranty
  - name: Returns
  - name: Chatbot
  - name: Admin Customers
  - name: Admin Staffs
  - name: Admin Categories
  - name: Admin Products
  - name: Admin Orders
  - name: Admin News
  - name: Admin Inventory
  - name: Admin Reviews
  - name: Admin Promotions
  - name: Admin Suppliers
  - name: Admin Payments
  - name: Admin Statistics
  - name: Admin After Sales

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login with username and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a customer account
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          $ref: "#/components/responses/Success"
        "422":
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      operationId: getMe
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Error"
  /auth/sendVerifyEmail:
    post:
      tags: [Auth]
      summary: Send email verification OTP
      operationId: sendVerifyEmail
      requestBody:
        $ref: "#/components/requestBodies/EmailOtpTarget"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /auth/VerifyEmail:
    post:
      tags: [Auth]
      summary: Verify email OTP
      operationId: verifyEmail
      requestBody:
        $ref: "#/components/requestBodies/VerifyOtp"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Send reset-password OTP
      operationId: forgotPassword
      requestBody:
        $ref: "#/components/requestBodies/EmailOnly"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /auth/verify-reset-otp:
    post:
      tags: [Auth]
      summary: Verify reset-password OTP
      operationId: verifyResetOtp
      requestBody:
        $ref: "#/components/requestBodies/VerifyOtp"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with reset token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, resetToken, newPassword]
              properties:
                email:
                  type: string
                  format: email
                resetToken:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password
      operationId: changePassword
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                oldPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /auth/google:
    get:
      tags: [Auth]
      summary: Start Google OAuth login
      operationId: startGoogleOAuth
      parameters:
        - name: rememberMe
          in: query
          schema:
            type: string
            enum: ["true", "false"]
            default: "false"
      responses:
        "302":
          description: Redirects to Google OAuth
  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback
      operationId: googleOAuthCallback
      responses:
        "302":
          description: Redirects to frontend login-success
  /auth/facebook:
    get:
      tags: [Auth]
      summary: Start Facebook OAuth login
      operationId: startFacebookOAuth
      parameters:
        - name: rememberMe
          in: query
          schema:
            type: string
            enum: ["true", "false"]
            default: "false"
      responses:
        "302":
          description: Redirects to Facebook OAuth
  /auth/facebook/callback:
    get:
      tags: [Auth]
      summary: Facebook OAuth callback
      operationId: facebookOAuthCallback
      responses:
        "302":
          description: Redirects to frontend login-success
  /auth/fail:
    get:
      tags: [Auth]
      summary: OAuth failure response
      operationId: oauthFail
      responses:
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and clear accessToken cookie
      operationId: logout
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /customers/me:
    patch:
      tags: [Profile]
      summary: Update customer profile
      operationId: updateCustomerMe
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerProfileUpdate"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /staffs/me:
    patch:
      tags: [Profile]
      summary: Update staff profile
      operationId: updateStaffMe
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffProfileUpdate"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /categories:
    get:
      tags: [Catalog]
      summary: List public categories
      operationId: listCategories
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /categories/{id}:
    get:
      tags: [Catalog]
      summary: Get public category detail
      operationId: getCategory
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /attributes:
    get:
      tags: [Catalog]
      summary: List product attributes
      operationId: listAttributes
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /attributes/{id}:
    get:
      tags: [Catalog]
      summary: Get product attribute detail
      operationId: getAttribute
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /products:
    get:
      tags: [Catalog]
      summary: List public products
      operationId: listProducts
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
        - name: category
          in: query
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /products/{id}:
    get:
      tags: [Catalog]
      summary: Get public product detail
      operationId: getProduct
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /cart:
    get:
      tags: [Cart]
      summary: Get current user's cart
      operationId: getCart
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /cart/summary:
    post:
      tags: [Cart]
      summary: Calculate cart checkout summary
      operationId: calculateCartSummary
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartSummaryRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      operationId: addCartItem
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemRequest"
      responses:
        "201":
          $ref: "#/components/responses/Success"
    delete:
      tags: [Cart]
      summary: Clear cart or remove selected items
      operationId: clearCart
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /cart/items/{id}:
    patch:
      tags: [Cart]
      summary: Update cart item quantity by variant id
      operationId: updateCartItem
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [SoLuong]
              properties:
                SoLuong:
                  type: integer
                  minimum: 1
      responses:
        "200":
          $ref: "#/components/responses/Success"
    delete:
      tags: [Cart]
      summary: Remove cart item by variant id
      operationId: deleteCartItem
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /orders:
    post:
      tags: [Orders]
      summary: Create order from selected cart variants
      operationId: createOrder
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          $ref: "#/components/responses/Success"
    get:
      tags: [Orders]
      summary: List current user's orders
      operationId: listMyOrders
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /orders/calculate-fee:
    post:
      tags: [Orders]
      summary: Calculate shipping fee
      operationId: calculateShippingFee
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/FeeCalculation"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /orders/calculate-discount:
    post:
      tags: [Orders]
      summary: Calculate order discount
      operationId: calculateDiscount
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/FeeCalculationRequest"
                - type: object
                  properties:
                    listCode:
                      type: array
                      items:
                        type: string
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /orders/calculate-product:
    post:
      tags: [Orders]
      summary: Calculate product subtotal
      operationId: calculateProductFee
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/OrderFeeItem"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /orders/{orderCode}:
    get:
      tags: [Orders]
      summary: Get current user's order detail
      operationId: getMyOrderDetail
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderCodeParam"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /orders/{orderCode}/cancel:
    put:
      tags: [Orders]
      summary: Customer cancels a pending order
      operationId: cancelMyOrder
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderCodeParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /payment:
    get:
      tags: [Payments]
      summary: List payment methods
      operationId: listPaymentMethods
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /payment/zalo-create:
    post:
      tags: [Payments]
      summary: Create ZaloPay payment transaction
      operationId: createZaloPayment
      requestBody:
        $ref: "#/components/requestBodies/PaymentCreate"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /payment/zalo-ipn:
    post:
      tags: [Payments]
      summary: ZaloPay IPN callback
      operationId: zaloPayIpn
      requestBody:
        $ref: "#/components/requestBodies/AnyJson"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /payment/check-status/{app_trans_id}:
    get:
      tags: [Payments]
      summary: Check ZaloPay transaction status
      operationId: checkZaloPayStatus
      parameters:
        - name: app_trans_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /payment/momo-create:
    post:
      tags: [Payments]
      summary: Create MoMo payment transaction
      operationId: createMomoPayment
      requestBody:
        $ref: "#/components/requestBodies/PaymentCreate"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /payment/momo-ipn:
    post:
      tags: [Payments]
      summary: MoMo IPN callback
      operationId: momoIpn
      requestBody:
        $ref: "#/components/requestBodies/AnyJson"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /promotions:
    get:
      tags: [Promotions]
      summary: List public promotions
      operationId: listPromotions
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /vouchers/me:
    get:
      tags: [Promotions]
      summary: List current user's voucher wallet
      operationId: listMyVouchers
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: tab
          in: query
          schema:
            type: string
            enum: [usable, used, expired]
            default: usable
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /vouchers/save-voucher:
    post:
      tags: [Promotions]
      summary: Save promotion to voucher wallet
      operationId: saveVoucher
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idPromotion]
              properties:
                idPromotion:
                  type: integer
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /vouchers/{id}:
    delete:
      tags: [Promotions]
      summary: Delete voucher wallet item
      operationId: deleteVoucher
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /reviews:
    post:
      tags: [Reviews]
      summary: Create product review
      operationId: createReview
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "201":
          $ref: "#/components/responses/Success"
  /reviews/{id}/reviews:
    get:
      tags: [Reviews]
      summary: List reviews for product id
      operationId: listProductReviews
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /reviews/{id}/ratings:
    get:
      tags: [Reviews]
      summary: Get rating summary for product id
      operationId: getProductRating
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /news:
    get:
      tags: [News]
      summary: List public news
      operationId: listNews
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /news/{id}:
    get:
      tags: [News]
      summary: Get public news detail
      operationId: getNews
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /warranties:
    get:
      tags: [Warranty]
      summary: List current customer's warranties
      operationId: listMyWarranties
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /warranties/{id}:
    get:
      tags: [Warranty]
      summary: Get current customer's warranty detail
      operationId: getMyWarranty
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /warranties/{id}/request:
    post:
      tags: [Warranty]
      summary: Request warranty processing
      operationId: requestWarranty
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                NoiDungXuLy:
                  type: string
                AnhMinhChung:
                  type: string
                  format: uri
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /returns:
    get:
      tags: [Returns]
      summary: List current customer's return requests
      operationId: listMyReturns
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      tags: [Returns]
      summary: Create return request
      operationId: createReturn
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReturnRequest"
      responses:
        "201":
          $ref: "#/components/responses/Success"
  /returns/{id}:
    get:
      tags: [Returns]
      summary: Get current customer's return request detail
      operationId: getMyReturn
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /returns/{id}/cancel:
    patch:
      tags: [Returns]
      summary: Customer cancels a waiting return request
      operationId: cancelReturn
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                LyDo:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /chatbot/webhook:
    post:
      tags: [Chatbot]
      summary: Dialogflow webhook endpoint
      operationId: chatbotWebhook
      requestBody:
        $ref: "#/components/requestBodies/AnyJson"
      responses:
        "200":
          description: Dialogflow fulfillment response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /admin/customers:
    get:
      tags: [Admin Customers]
      summary: List customers
      operationId: adminListCustomers
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /admin/customers/{id}:
    get:
      tags: [Admin Customers]
      summary: Get customer detail
      operationId: adminGetCustomer
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /admin/staffs:
    get:
      tags: [Admin Staffs]
      summary: List staff accounts
      operationId: adminListStaffs
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      tags: [Admin Staffs]
      summary: Create staff account
      operationId: adminCreateStaff
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffRequest"
      responses:
        "201":
          $ref: "#/components/responses/Success"
  /admin/staffs/{id}:
    get:
      tags: [Admin Staffs]
      summary: Get staff detail
      operationId: adminGetStaff
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    patch:
      tags: [Admin Staffs]
      summary: Update staff profile
      operationId: adminUpdateStaff
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffProfileUpdate"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    delete:
      tags: [Admin Staffs]
      summary: Delete staff account
      operationId: adminDeleteStaff
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /admin/categories:
    get:
      tags: [Admin Categories]
      summary: List categories
      operationId: adminListCategories
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      tags: [Admin Categories]
      summary: Create category
      operationId: adminCreateCategory
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/Category"
      responses:
        "201":
          $ref: "#/components/responses/Success"
  /admin/categories/{id}:
    get:
      tags: [Admin Categories]
      summary: Get category detail
      operationId: adminGetCategory
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          $ref: "#/components/responses/Success"
    put:
