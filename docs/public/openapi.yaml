        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /admin/after_sales/risks/{id}/status:
    patch:
      tags: [Admin After Sales]
      summary: Update after-sales risk status
      operationId: adminUpdateRiskStatus
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                TrangThai:
                  type: integer
                GhiChu:
                  type: string
                MaNhanVienPhuTrach:
                  type: integer
      responses:
        "200":
          $ref: "#/components/responses/Success"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    OrderCodeParam:
      name: orderCode
      in: path
      required: true
      schema:
        type: string
        example: DH260527ABCD
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        default: 10
    Search:
      name: search
      in: query
      schema:
        type: string
        default: ""
    Sort:
      name: sort
      in: query
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [ASC, DESC]
        default: DESC
    StartDate:
      name: startDate
      in: query
      schema:
        type: string
        format: date
    EndDate:
      name: endDate
      in: query
      schema:
        type: string
        format: date

  requestBodies:
    AnyJson:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    EmailOnly:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email:
                type: string
                format: email
    EmailOtpTarget:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email:
                type: string
                format: email
              username:
                type: string
    VerifyOtp:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, otp]
            properties:
              email:
                type: string
                format: email
              otp:
                type: string
    FeeCalculation:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FeeCalculationRequest"
    PaymentCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [maDonHang]
            properties:
              maDonHang:
                type: integer
                example: 123
    Category:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [TenDanhMuc]
            properties:
              TenDanhMuc:
                type: string
              MoTa:
                type: string
              ParentID:
                type: integer
                nullable: true
    News:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title]
            properties:
              title:
                type: string
              content:
                type: string
              imageUrl:
                type: string
                format: uri
              status:
                type: integer
                enum: [0, 1]
    Supplier:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [TenNhaCC]
            properties:
              TenNhaCC:
                type: string
              Diachi:
                type: string
              SDT:
                type: string
    BinaryStatus:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: integer
                enum: [0, 1]
    AdminNote:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              GhiChu:
                type: string
              NoiDungXuLy:
                type: string
              MaNhanVienXuLy:
                type: integer

  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessResponse"
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Xlsx:
      description: XLSX file
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        result:
          type: object
          additionalProperties: true
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
      required: [success, message]
      additionalProperties: true
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: customer01
        password:
          type: string
          example: "123456"
        rememberMe:
          type: boolean
          default: false
    RegisterRequest:
      type: object
      required: [username, password, email]
      properties:
        username:
          type: string
          maxLength: 100
        password:
          type: string
          minLength: 6
        name:
          type: string
          maxLength: 100
        phone_number:
          type: string
          example: "0987654321"
        email:
          type: string
          format: email
        address:
          type: string
          maxLength: 255
    CustomerProfileUpdate:
      type: object
      properties:
        TenKhachHang:
          type: string
        SDT:
          type: string
        DiaChi:
          type: string
        Avatar:
          type: string
          format: uri
    StaffProfileUpdate:
      type: object
      properties:
        TenNhanVien:
          type: string
        SDT:
          type: string
        DiaChi:
          type: string
        NgaySinh:
          type: string
          format: date
    CartItemRequest:
      type: object
      required: [MaBienThe, SoLuong]
      properties:
        MaBienThe:
          type: integer
        SoLuong:
          type: integer
          minimum: 1
    CartSummaryRequest:
      type: object
      properties:
        selectedVariantIds:
          type: array
          items:
            type: integer
        MaPhi:
          type: integer
        addressObj:
          type: object
          additionalProperties: true
        ListMaKhuyenMai:
          type: array
          items:
            type: integer
    OrderFeeItem:
      type: object
      required: [MaBienThe, SoLuong]
      properties:
        MaBienThe:
          type: integer
        SoLuong:
          type: integer
          minimum: 1
    FeeCalculationRequest:
      type: object
      required: [items, addressObj, MaPhi]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderFeeItem"
        addressObj:
          type: object
          additionalProperties: true
        MaPhi:
          type: integer
    CreateOrderRequest:
      type: object
      required: [orderData, selectedVariantIds]
      properties:
        selectedVariantIds:
          type: array
          items:
            type: integer
        orderData:
          type: object
          required: [TenNguoiNhan, SDT, DiaChiGiaoHang, MaPhuongThuc]
          properties:
            TenNguoiNhan:
              type: string
            SDT:
              type: string
            DiaChiGiaoHang:
              type: string
            MaPhuongThuc:
              type: integer
              enum: [1, 4, 5]
              description: "1 COD, 4 MoMo, 5 ZaloPay"
            MaPhi:
              type: integer
            addressObj:
              type: object
              additionalProperties: true
            ListMaKhuyenMai:
              type: array
              items:
                type: integer
            GhiChu:
              type: string
    CreateReviewRequest:
      type: object
      required: [MaSanPham, DiemDanhGia]
      properties:
        MaSanPham:
          type: integer
        DiemDanhGia:
          type: integer
          minimum: 1
          maximum: 5
        NoiDung:
          type: string
    ProductUpsertRequest:
      type: object
      required: [categoryID, productName, thumbnail, BienThe]
      properties:
        categoryID:
          type: integer
        productName:
          type: string
        thumbnail:
          type: string
        brand:
          type: string
        description:
          type: string
        status:
          type: integer
          enum: [0, 1]
          default: 1
        BienThe:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariantInput"
    ProductVariantInput:
      type: object
      required: [TenBienThe, Gia, SoLuong]
      properties:
        MaBienThe:
          type: integer
        TenBienThe:
          type: string
        Gia:
          type: number
        SoLuong:
          type: integer
        TrangThai:
          type: integer
          enum: [0, 1]
        MoTa:
          type: string
        KhoiLuong:
          type: number
        ChieuDai:
          type: number
        ChieuRong:
          type: number
        ChieuCao:
          type: number
        HinhAnh:
          type: array
          items:
            type: string
            format: uri
        ThuocTinh:
          type: array
          items:
            type: integer
    PromotionUpsertRequest:
      type: object
      required: [MaLoaiKM, TenKhuyenMai, GiaTri]
      properties:
        MaLoaiKM:
          type: integer
        TenKhuyenMai:
          type: string
        GiaTri:
          type: number
        GiaTriToiThieu:
          type: number
        GiamToiDa:
          type: number
        NgayBatDau:
          type: string
          format: date-time
        NgayKetThuc:
          type: string
          format: date-time
        TrangThai:
          type: integer
          enum: [0, 1]
        MaCode:
          type: string
        SoLuong:
          type: integer
        LoaiVoucher:
          type: integer
          enum: [1, 2]
          description: "1 order discount, 2 shipping discount"
        MaDanhMuc:
          type: integer
          nullable: true
    CreateStaffRequest:
      type: object
      required: [email, name, username, phoneNumber, dob, address]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        username:
          type: string
        phoneNumber:
          type: string
        dob:
          type: string
          format: date
        address:
          type: string
    DateRange:
      type: object
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    OrderStatus:
      type: integer
      enum: [0, 1, 2, 3, 4]
      description: "0 pending, 1 preparing, 2 shipping, 3 completed, 4 canceled"
    WarrantyStatus:
      type: integer
      enum: [0, 1, 2, 3, 4, 5]
      description: "0 expired, 1 active, 2 requested, 3 processing, 4 completed, 5 rejected"
    WarrantyHistoryRequest:
      type: object
      properties:
        HanhDong:
          type: string
        NoiDungXuLy:
          type: string
        TrangThai:
          type: integer
        AnhMinhChung:
          type: string
          format: uri
        MaNhanVienXuLy:
          type: integer
    WarrantyStatusUpdate:
      allOf:
        - $ref: "#/components/schemas/WarrantyHistoryRequest"
        - type: object
          required: [TrangThai]
          properties:
            TrangThai:
              $ref: "#/components/schemas/WarrantyStatus"
    ReturnStatus:
      type: integer
      enum: [0, 1, 2, 3, 4, 5]
      description: "0 waiting, 1 approved, 2 rejected, 3 processing, 4 completed, 5 customer canceled"
    ReturnRequestType:
      type: string
      enum: [DOI_HANG, TRA_HANG, HOAN_TIEN, VO_HONG_VAN_CHUYEN, THIEU_HANG, SAI_SAN_PHAM]
    ReturnCondition:
      type: string
      enum: [CON_NGUYEN, DA_SU_DUNG, VO_HONG, LOI_SAN_XUAT, KHONG_NHAN_LAI]
    ReturnProcessType:
      type: string
      enum: [DOI_SAN_PHAM, GUI_BO_SUNG, HOAN_TIEN_MOT_PHAN, HOAN_TIEN_TOAN_PHAN]
    CreateReturnRequest:
      type: object
      required: [MaCTDH, SoLuongDoiTra]
      properties:
        MaCTDH:
          type: integer
        LoaiYeuCau:
          $ref: "#/components/schemas/ReturnRequestType"
        SoLuongDoiTra:
          type: integer
          minimum: 1
        LyDo:
          type: string
        TinhTrangHangTra:
          $ref: "#/components/schemas/ReturnCondition"
        AnhMinhChung:
          type: string
          format: uri
        MaBienTheDoi:
          type: integer
    ProcessReturnRequest:
      type: object
      required: [HinhThucXuLy]
      properties:
        HinhThucXuLy:
          $ref: "#/components/schemas/ReturnProcessType"
        SoLuongDoiTra:
          type: integer
        CoNhapLaiKho:
          type: boolean
        SoTienHoan:
          type: number
        MaBienTheDoi:
          type: integer
        NoiDungXuLy:
          type: string
        MaNhanVienXuLy:
          type: integer
    RiskRequest:
      type: object
      required: [MaDonHang]
      properties:
        MaDonHang:
          type: integer
        LoaiRuiRo:
          type: string
        MucDo:
          type: string
          enum: [THAP, BINH_THUONG, CAO, NGHIEM_TRONG]
        NguonPhatHien:
          type: string
        MoTa:
          type: string
        GhiChu:
          type: string
        MaNhanVienPhuTrach:
          type: integer
