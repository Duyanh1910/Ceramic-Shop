<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Thanh Toán - Đơn 60003</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border border-gray-100">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z">
                    </path>
                </svg>
            </div>
            <h2 class="text-2xl font-extrabold text-gray-800">Thanh Toán VNPay</h2>
            <p class="text-sm text-gray-500 mt-1">Môi trường Test Sandbox</p>
        </div>

        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-6">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm text-gray-500 font-medium">Mã hệ thống (ID):</span>
                <span class="text-sm font-bold text-gray-800">60003</span>
            </div>
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm text-gray-500 font-medium">Mã hiển thị:</span>
                <span class="text-sm font-bold text-blue-600">DH260401JTZM</span>
            </div>
            <div class="border-t border-gray-200 my-2 pt-2 flex justify-between items-center">
                <span class="text-sm text-gray-500 font-medium">Cần thanh toán:</span>
                <span class="text-lg font-extrabold text-red-500">705,800 đ</span>
            </div>
        </div>

        <button onclick="testPayment()" id="payBtn"
            class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3.5 px-4 rounded-xl shadow-md transition-all duration-200 flex justify-center items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
                </path>
            </svg>
            <span id="btnText">Thanh toán ngay</span>
        </button>

        <div id="errorBox" class="mt-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 hidden">
            <p id="errorText" class="font-medium text-center"></p>
        </div>
    </div>

    <script>
const TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6NCwicm9sZSI6IkN1c3RvbWVyIiwiaWF0IjoxNzc1MTEwNDc4LCJleHAiOjE3Nzc3MDI0Nzh9.OpVSVYb4FbEFUXEoYFxPwlwjUxQ_OPNIJ6LC_BxqkHg"; // token bạn có
const BACKEND_URL = 'https://ceramic-shop-u8ak.onrender.com/api/v1/payment/vnpay-create';
async function testPayment() {
    const btn = document.getElementById('payBtn');
    const btnText = document.getElementById('btnText');
    const errorBox = document.getElementById('errorBox');
    const errorText = document.getElementById('errorText');

    try {
        btn.disabled = true;
        btnText.innerText = 'Đang xử lý...';

        const response = await fetch(BACKEND_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${TOKEN}` // 👈 QUAN TRỌNG
            },
            body: JSON.stringify({
                maDonHang: 60003
            })
        });

        const data = await response.json();

        if (response.ok && data.success && data.paymentUrl) {
            window.location.href = data.paymentUrl;
        } else {
            throw new Error(data.message || 'Lỗi backend');
        }

    } catch (error) {
        errorText.innerText = error.message;
        errorBox.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btnText.innerText = 'Thanh toán ngay';
    }
}
</script>
</body>

</html>
