<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán Thành Công</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <h2 class="text-2xl font-bold mb-2 text-gray-800">Thanh toán thành công!</h2>
        <p class="text-gray-600 mb-6">Cảm ơn bạn đã mua hàng. Đơn hàng của bạn đang được xử lý.</p>
        
        <div class="bg-gray-50 p-4 rounded-lg text-left mb-6">
            <p class="text-sm text-gray-500">Mã giao dịch:</p>
            <p class="font-mono font-bold text-gray-800" id="txnRef">Đang tải...</p>
        </div>

        <a href="index.html" class="inline-block w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded transition duration-200">
            Tiếp tục mua sắm
        </a>
    </div>

    <script>
        // Lấy mã giao dịch từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const txnRef = urlParams.get('txnRef');
        
        if (txnRef) {
            document.getElementById('txnRef').innerText = txnRef;
        } else {
            document.getElementById('txnRef').innerText = "Không tìm thấy mã GD";
        }
    </script>
</body>
</html>
